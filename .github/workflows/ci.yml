# CI: 9-job matrix — 3 Deno v2.9 + 3 Bun + 3 Node 22 (Linux/macOS/Windows)
# No Chromium, no Playwright, no external services
# Browser tests (client-browser, adapters-view-client) excluded — run locally via test:browser
name: CI

on:
  push:
    branches: [dev]
  pull_request:
    branches: [dev]

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  # ───────────────── Deno ─────────────────
  test-deno:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.9

      - name: Cache dependencies
        continue-on-error: true
        run: deno cache src/mod.ts tests/ --minimum-dependency-age=0

      - name: Check
        run: deno check src/mod.ts

      - name: Lint
        run: deno lint src/

      - name: Test (Deno)
        run: deno test -A --minimum-dependency-age=0 --no-check tests/ --ignore=tests/client-browser.test.ts,tests/adapters-view-client.test.ts

  # ───────────────── Bun ─────────────────
  test-bun:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Cache dependencies
        continue-on-error: true
        run: bun install || true

      - name: Test (Bun)
        run: bun test tests/adapters-preact.test.ts tests/adapters-react.test.ts tests/adapters-view.test.ts tests/client-utils.test.ts tests/edge-cases.test.ts tests/layout.test.ts tests/mod.test.ts tests/ssg-advanced.test.ts tests/ssg.test.ts tests/ssr-comprehensive.test.ts tests/ssr.test.ts tests/utils.test.ts

  # ───────────────── Node.js 22+ ─────────────────
  test-node:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install dependencies
        run: npm install

      - name: Test (Node.js)
        run: node --import tsx --test-force-exit test-node.mjs
